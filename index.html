<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PostImob AI — Importador MyBroker</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#14233b;background:#f4f6fa}*{box-sizing:border-box}
main{max-width:850px;margin:35px auto;padding:20px}.card{background:white;padding:24px;border-radius:18px;box-shadow:0 5px 25px #14233b12;margin-bottom:16px}
h1{margin:0 0 8px}p{line-height:1.5;color:#506078}label{display:block;font-weight:650;margin:14px 0 7px}
input,textarea{width:100%;padding:13px;border:1px solid #cbd4e0;border-radius:9px;font:inherit}textarea{min-height:170px}
button{border:0;background:#154c94;color:white;padding:13px 18px;border-radius:9px;font-weight:700;cursor:pointer;margin-top:12px}
button:disabled{opacity:.5;cursor:wait}.muted{font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.photo{position:relative}.photo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.photo label{font-size:12px;margin:4px 0}
.status{padding:12px;border-radius:9px;background:#eef3fa;white-space:pre-wrap}a{color:#154c94}
</style></head><body><main>
<div class="card"><h1>🏠 PostImob AI</h1><p>Importe um anúncio público da MyBroker, confira as imagens e prepare a legenda para Instagram.</p>
<label for="url">Link do imóvel</label><input id="url" value="https://www.mybroker.com.br/casa/mt/caceres/santos-dumont/384643">
<button id="load">Importar imóvel</button><div id="status" class="status" style="margin-top:14px">Aguardando importação. Nenhuma informação foi extraída ainda.</div></div>
<div id="result" class="card" hidden><h2 id="name">Imóvel</h2><p id="info"></p><h3>Fotos encontradas</h3><div id="photos" class="grid"></div>
<label for="caption">Legenda editável</label><textarea id="caption"></textarea>
<button id="copy">Copiar legenda</button> <button id="download">Baixar fotos selecionadas</button>
<p class="muted">Revise os dados antes de publicar. A publicação automática no Instagram ainda não está integrada.</p></div>
</main><script>
const $=s=>document.querySelector(s);let imgs=[];
function status(t){$('#status').textContent=t}
$('#load').onclick=async()=>{
 $('#result').hidden=true;$('#load').disabled=true;status('Tentando acessar os dados públicos do anúncio...');
 try{
 const url=$('#url').value.trim(),parsed=new URL(url);
 if(!['mybroker.com.br','www.mybroker.com.br'].includes(parsed.hostname))throw Error('Use um link do site MyBroker.');
 const r=await fetch('/api/import?url='+encodeURIComponent(url));
 const data=await r.json();if(!r.ok)throw Error(data.error||'Falha na importação');
 imgs=data.images||[];$('#name').textContent=data.title||'Imóvel MyBroker';
 $('#info').textContent=[data.price,data.address,data.description].filter(Boolean).join(' • ').slice(0,700);
 const code=url.match(/(\d{4,})(?:\/?(?:\?.*)?)?$/)?.[1]||'';
 $('#caption').value=`🏡 ${data.title||'Imóvel disponível em Cáceres-MT'}\n\n${data.description||'Confira as características deste imóvel no anúncio original.'}\n\n${data.price?('💰 '+data.price+'\n'):''}${data.address?('📍 '+data.address+'\n'):''}${code?('🔎 Código: '+code+'\n'):''}\n📲 Fale comigo para saber mais e agendar uma visita!\n\nFelipe Lazarin | Corretor de Imóveis\nCRECI-MT 23042\nMyBroker Soluções Imobiliárias\n\n#ImoveisCaceres #MyBroker #CaceresMT`;
 $('#photos').replaceChildren();
 imgs.forEach((src,i)=>{let box=document.createElement('div');box.className='photo';let image=document.createElement('img');image.src=src;image.loading='lazy';image.onerror=()=>{image.alt='Imagem indisponível'};let label=document.createElement('label');let cb=document.createElement('input');cb.type='checkbox';cb.checked=i<10;cb.style.width='auto';label.append(cb,document.createTextNode(' Selecionar foto '+(i+1)));box.append(image,label);$('#photos').append(box)});
 $('#result').hidden=false;status(`Importação concluída: ${imgs.length} imagem(ns) candidata(s) encontrada(s). Confira se pertencem ao imóvel.`);
 }catch(e){status('Não foi possível importar: '+e.message+'\nO site pode bloquear a leitura automática. Não foram inventados dados.')}finally{$('#load').disabled=false}
};
$('#copy').onclick=async()=>{await navigator.clipboard.writeText($('#caption').value);status('Legenda copiada!')};
$('#download').onclick=()=>{const cbs=[...document.querySelectorAll('#photos input')];const selected=imgs.filter((_,i)=>cbs[i].checked);if(!selected.length)return status('Selecione pelo menos uma foto.');selected.forEach((src,i)=>{const a=document.createElement('a');a.href='/api/photo?url='+encodeURIComponent(src);a.download='mybroker-foto-'+(i+1)+'.jpg';a.target='_blank';document.body.append(a);a.click();a.remove()});status('Downloads solicitados. Seu navegador pode pedir permissão para baixar múltiplas fotos.')};
</script></body></html>
